<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Application de gestion de tournois de Belote Coinche" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/bcc_full_192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="BCC Coinche" />
		<script>
			// Applies the stored theme before the first paint, so the page never
			// renders with the default theme and then swaps. Must stay inline,
			// blocking, and above the SvelteKit head placeholder below.
			// (Never write that placeholder's literal text here — SvelteKit
			// substitutes it anywhere it appears, comments included.)
			(function () {
				var themes = ['brutalist', 'app', 'skeuomorphe'];
				var theme = 'app';
				try {
					var stored = localStorage.getItem('bcc-theme');
					if (themes.indexOf(stored) !== -1) theme = stored;
				} catch (e) {
					// localStorage unavailable (private mode) — fall back to the default.
				}
				document.documentElement.dataset.bccTheme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
